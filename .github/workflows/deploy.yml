# Builds the site and publishes it to GitHub Pages on every push to main.
# Live at https://lightshift07.github.io/for-zahra/
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Also validates every letter — a broken letter stops the deploy and the live site stays as it was.
      - run: npm run build
        env:
          # PREVIEW MODE: unlocks every dated letter on the live site for testing.
          # Delete these two lines before Zahra gets the link.
          VITE_UNLOCK_ALL: 'true'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
