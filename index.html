<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>For Zahra</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#FFE4EC" />

    <!-- Home-screen app -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="For Zahra" />

    <!-- Fonts: self-hosted (public/fonts, Latin subset only; licences in licenses/fonts).
         Cormorant Garamond italic (display), Caveat (letter body), Nunito (UI).
         Deliberately NOT preloaded: on slow connections a preload competes with the JS
         the page needs to render at all, and measured slower (first paint 1.50s vs 1.13s). -->
    <style>
      @font-face {
        font-family: 'Cormorant Garamond';
        font-style: italic;
        font-weight: 500 600;
        font-display: swap;
        src: url('./fonts/cormorant-garamond-italic-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Caveat';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url('./fonts/caveat-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Nunito';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url('./fonts/nunito-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
